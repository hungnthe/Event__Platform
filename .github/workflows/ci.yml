name: CI
on: { pull_request: {}, push: { branches: [main] } }
jobs:
  verify:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.6-alpine
        env: { POSTGRES_DB: eventflow, POSTGRES_USER: eventflow, POSTGRES_PASSWORD: eventflow_dev_password }
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U eventflow -d eventflow" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:8.2.1-alpine
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
      minio:
        image: minio/minio:RELEASE.2025-09-07T16-13-09Z
        env: { MINIO_ROOT_USER: eventflow_minio, MINIO_ROOT_PASSWORD: eventflow_minio_dev_secret }
        ports: [9000:9000]
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      NODE_ENV: test
      API_PORT: 3001
      CORS_ORIGINS: http://localhost:3000
      DATABASE_URL: postgresql://eventflow:eventflow_dev_password@localhost:5432/eventflow?schema=public
      REDIS_URL: redis://localhost:6379
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_BUCKET: eventflow-dev
      S3_ACCESS_KEY: eventflow_minio
      S3_SECRET_KEY: eventflow_minio_dev_secret
      S3_FORCE_PATH_STYLE: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.19.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm db:migrate
      - name: Create MinIO test bucket
        run: docker run --rm --network host minio/mc:RELEASE.2025-08-13T08-35-41Z sh -c 'mc alias set local http://localhost:9000 eventflow_minio eventflow_minio_dev_secret && mc mb --ignore-existing local/eventflow-dev'
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:e2e
      - run: pnpm build
      - run: docker build -f apps/api/Dockerfile -t eventflow-api:ci .
      - run: docker build -f apps/web/Dockerfile -t eventflow-web:ci .
