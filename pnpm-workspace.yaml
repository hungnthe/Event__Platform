packages:
  - apps/*
  - packages/*
overrides:
  confbox: 0.3.1
onlyBuiltDependencies:
  - '@nestjs/core'
  - '@prisma/client'
  - '@prisma/engines'
  - '@tailwindcss/oxide'
  - esbuild
  - prisma
  - sharp
  - unrs-resolver
allowBuilds:
  '@nestjs/core': true
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': false
  '@tailwindcss/oxide': true
  argon2: true
  esbuild: true
  nestjs-pino: false
  prisma: true
  sharp: true
  unrs-resolver: true
